[tox]
envlist = py311,py312,py313,py314,lint,docs
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run the unit test suite with pytest
package = editable
extras = test
commands = python -m pytest {posargs}

[testenv:docs]
description = Build the Sphinx documentation
package = editable
extras = docs
commands = python -m sphinx -W -b html docs docs/_build/html

[testenv:lint]
description = Run the maintained lint stack
skip_install = true
deps = ruff>=0.15.8
commands = ruff check abydos tests docs helpers
